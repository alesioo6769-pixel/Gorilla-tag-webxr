<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gorilla Forest VR</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17251b;font-family:system-ui,Arial;color:white}
  #hud{position:fixed;z-index:5;top:12px;left:12px;background:#102018cc;padding:10px 13px;border:1px solid #ffffff35;border-radius:12px;max-width:calc(100% - 48px)}
  #hud strong{font-size:17px} #status{font-size:12px;opacity:.85;margin-top:3px}
  #help{font-size:12px;opacity:.85;margin-top:5px}
  #name{width:112px;background:#ffffff18;color:white;border:1px solid #ffffff55;border-radius:7px;padding:6px}
  canvas{touch-action:none;display:block}
  #mobile{display:none;position:fixed;z-index:6;bottom:24px;left:20px;width:130px;height:130px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff66;touch-action:none}
  #stick{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#ffffff99}
  #jump{display:none;position:fixed;z-index:6;right:24px;bottom:40px;width:92px;height:92px;border-radius:50%;border:2px solid white;background:#245f38cc;color:white;font-weight:bold}
  #error{position:fixed;z-index:10;bottom:10px;left:10px;right:10px;color:#ffd1d1;font-size:12px}
  @media (pointer:coarse){#mobile{display:block}#jump{display:block}#help{max-width:250px}}
</style>
</head>
<body>
<div id="hud">
  <strong;§uçâç~ºw^~)Þu Gorilla Forest VR</strong><br>
  <span id="status">Conectando al servidorºw^~)Þv</span><br>
  <input id="name" maxlength="18" value="Gorilla" aria-label="Nombre de jugador">
  <div id="help">Móvil: joystick para caminar, arrastra la pantalla para mirar y pulsa SALTAR · Quest: pulsa ENTER VR</div>
</div>
<div id="mobile"><div id="stick"></div></div>
<button id="jump">SALTAR</button>
<div id="error"></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { VRButton } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js";

const statusEl = document.querySelector("#status");
const errorEl = document.querySelector("#error");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc9d5);
scene.fog = new THREE.Fog(0x9bc9d5, 28, 115);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 180);
camera.position.set(0, 1.55, 5);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

scene.add(new THREE.HemisphereLight(0xdff5ff, 0x52633a, 2.0));
const sun = new THREE.DirectionalLight(0xfff2d6, 2.2);
sun.position.set(-12, 24, 10); sun.castShadow = true; scene.add(sun);

const mat = (color, roughness=1) => new THREE.MeshStandardMaterial({color, roughness});
const groundMat = mat(0x527b3c);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(180,180), groundMat);
ground.rotation.x=-Math.PI/2; ground.position.y=-0.08; ground.receiveShadow=true; scene.add(ground);

const trunkMat=mat(0x68452b), leafMats=[mat(0x2f773e),mat(0x438b45),mat(0x28663b)];
const rockMat=mat(0x777e78);
const solidObjects=[]; // Colisiones de troncos, rocas y tocones.
function tree(x,z,s=1){
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.34*s,3.2*s,7),trunkMat);
  trunk.position.set(x,1.52*s,z); trunk.castShadow=true; trunk.receiveShadow=true; scene.add(trunk);
  solidObjects.push({x,z,r:.34*s,top:3.12*s,type:"tree"});
  for(let i=0;i<3;i++){
    const crown=new THREE.Mesh(new THREE.IcosahedronGeometry((1.15-i*.12)*s,1),leafMats[i]);
    crown.position.set(x+(i-1)*.18*s,3.2*s+i*.52*s,z); crown.castShadow=true; scene.add(crown);
  }
}
for(let i=0;i<90;i++){
  const a=Math.random()*Math.PI*2, r=9+Math.random()*48;
  tree(Math.cos(a)*r,Math.sin(a)*r,.7+Math.random()*.8);
}
for(let i=0;i<18;i++){
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.45+Math.random()*.65,0),rockMat);
  const rx=(Math.random()-.5)*55, rz=(Math.random()-.5)*55, rr=rock.geometry.parameters.radius;
  rock.position.set(rx,.25,rz);
  rock.rotation.set(Math.random(),Math.random(),Math.random()); rock.castShadow=true; scene.add(rock);
  solidObjects.push({x:rx,z:rz,r:rr*.78,top:.25+rr*.72,type:"rock"});
}
// Stumps and low platforms
for(let i=0;i<9;i++){
  const x=(i%3-1)*4, z=-5-Math.floor(i/3)*4;
  const stump=new THREE.Mesh(new THREE.CylinderGeometry(.85,.95,1.1,9),trunkMat);
  stump.position.set(x,.48,z); stump.castShadow=true; scene.add(stump);
  solidObjects.push({x,z,r:.9,top:1.1,type:"stump"});
  const top=new THREE.Mesh(new THREE.CylinderGeometry(.86,.86,.12,9),mat(0x9b7448));
  top.position.set(x,1.06,z); scene.add(top);
}

const localMat=mat(0x76513b), handMat=mat(0x8c6247);
function makeGorilla(color=0x8c6247){
  const group=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(.38,12,10),mat(color));
  body.position.y=.95; group.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),mat(color));
  head.position.set(0,1.48,-.03); group.add(head);
  const eyeMat=mat(0x111111);
  for(const x of [-.105,.105]){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),eyeMat);
    eye.position.set(x,1.52,-.27); group.add(eye);
  }
  for(const side of [-1,1]){
    const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.52,4,8),mat(color));
    arm.position.set(side*.48,.93,-.02); arm.rotation.z=side*-.6; group.add(arm);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.19,10,8),handMat);
    hand.position.set(side*.72,.58,-.13); group.add(hand);
  }
  return group;
}
// Cuerpo visible en primera persona, unido a la cámara para seguir la mirada.
const firstPersonBody = new THREE.Group();
const bodyShell = new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),localMat);
bodyShell.scale.set(1,1.22,.72);
bodyShell.position.set(0,-.72,-.34);
firstPersonBody.add(bodyShell);
const firstPersonArms = new THREE.Group();
for(const side of [-1,1]){
  const arm = new THREE.Mesh(new THREE.CapsuleGeometry(.105,.43,5,10),localMat);
  arm.position.set(side*.39,-.43,-.38);
  arm.rotation.z=side*-.72;
  firstPersonArms.add(arm);
  const hand = new THREE.Mesh(new THREE.SphereGeometry(.145,12,10),handMat);
  hand.position.set(side*.61,-.67,-.5);
  firstPersonArms.add(hand);
}
firstPersonBody.add(firstPersonArms);
camera.add(firstPersonBody);

const mirrorTarget = new THREE.WebGLRenderTarget(512, 512);
const mirrorCamera = new THREE.PerspectiveCamera(70, 1, 0.1, 180);
mirrorCamera.layers.enable(1);
const mirrorFrame = new THREE.Mesh(new THREE.BoxGeometry(3.15, 2.35, .16), mat(0x40352b));
mirrorFrame.position.set(0, 1.65, -7.5); scene.add(mirrorFrame);
const mirrorSurface = new THREE.Mesh(new THREE.PlaneGeometry(2.85, 2.05), new THREE.MeshBasicMaterial({map:mirrorTarget.texture}));
mirrorSurface.position.set(0, 1.68, -7.405); scene.add(mirrorSurface);
const localMirrorAvatar = makeGorilla(0x76513b);
localMirrorAvatar.traverse(o => o.layers.set(1));
scene.add(localMirrorAvatar);
const mirrorPlaneZ = mirrorSurface.position.z;
function renderMirror(){
  const sourcePos = new THREE.Vector3(), sourceDir = new THREE.Vector3();
  camera.getWorldPosition(sourcePos); camera.getWorldDirection(sourceDir);
  mirrorCamera.position.set(sourcePos.x, sourcePos.y, 2*mirrorPlaneZ-sourcePos.z);
  const reflectedTarget = sourcePos.clone().add(sourceDir);
  reflectedTarget.z = 2*mirrorPlaneZ-reflectedTarget.z;
  mirrorCamera.up.set(0,1,0); mirrorCamera.lookAt(reflectedTarget);
  localMirrorAvatar.position.set(camera.position.x, camera.position.y-1.55, camera.position.z);
  localMirrorAvatar.rotation.y = renderer.xr.isPresenting ? camera.rotation.y : yaw;
  mirrorSurface.visible = false;
  const oldTarget = renderer.getRenderTarget();
  renderer.setRenderTarget(mirrorTarget); renderer.clear(); renderer.render(scene, mirrorCamera);
  renderer.setRenderTarget(oldTarget); mirrorSurface.visible = true;
}

const remotes=new Map();
const socketUrl=(location.protocol==="https:"?"wss://":"ws://")+location.host;
let ws;
try{
  ws=new WebSocket(socketUrl);
  ws.onopen=()=>statusEl.textContent="Conectado · sala compartida";
  ws.onclose=()=>statusEl.textContent="Sin conexión · modo local";
  ws.onerror=()=>statusEl.textContent="No se pudo conectar al servidor";
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==="welcome"){myId=m.id; m.players.forEach(addRemote);}
    if(m.type==="joined") addRemote(m.player);
    if(m.type==="moved") updateRemote(m.player);
    if(m.type==="left"){const a=remotes.get(m.id);if(a)scene.remove(a);remotes.delete(m.id);}
  };
}catch(e){statusEl.textContent="Modo local";}

let myId=null;
function addRemote(p){
  if(p.id===myId)return;
  if(!remotes.has(p.id)){const a=makeGorilla(p.color);scene.add(a);remotes.set(p.id,a);}
  updateRemote(p);
}
function updateRemote(p){
  const a=remotes.get(p.id);if(!a)return;
  a.position.set(p.x,p.y-1.4,p.z);a.rotation.y=p.yaw||0;
}
let lastSend=0;
function sendPosition(now){
  if(ws?.readyState===1 && now-lastSend>70){
    lastSend=now;
    ws.send(JSON.stringify({type:"move",x:camera.position.x,y:camera.position.y,z:camera.position.z,yaw:camera.rotation.y,name:document.querySelector("#name").value}));
  }
}

// En móvil, desliza sobre el mundo para girar la cámara.
let yaw=0,pitch=0,lookPointer=null,lastLookX=0,lastLookY=0;
renderer.domElement.addEventListener("pointerdown",e=>{
  if(e.pointerType!=="touch" || renderer.xr.isPresenting)return;
  lookPointer=e.pointerId;lastLookX=e.clientX;lastLookY=e.clientY;
  try{renderer.domElement.setPointerCapture(e.pointerId);}catch(_){}
});
renderer.domElement.addEventListener("pointermove",e=>{
  if(e.pointerId!==lookPointer)return;
  const dx=e.clientX-lastLookX,dy=e.clientY-lastLookY;
  lastLookX=e.clientX;lastLookY=e.clientY;
  yaw-=dx*.004;
  pitch=Math.max(-1.05,Math.min(1.05,pitch-dy*.004));
  e.preventDefault();
});
function stopLook(e){if(e.pointerId===lookPointer)lookPointer=null;}
renderer.domElement.addEventListener("pointerup",stopLook);
renderer.domElement.addEventListener("pointercancel",stopLook);
renderer.domElement.addEventListener("lostpointercapture",stopLook);
let joy={x:0,y:0},jump=false,activePadPointer=null;
const pad=document.querySelector("#mobile"),stick=document.querySelector("#stick");
function padMove(e){
  const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const len=Math.hypot(dx,dy),max=Math.min(r.width,r.height)*0.32;
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  joy.x=dx/max;joy.y=dy/max;
  stick.style.transform=`translate3d(${dx}px,${dy}px,0)`;
  e.preventDefault();
}
pad.addEventListener("pointerdown",e=>{
  e.preventDefault();activePadPointer=e.pointerId;
  try{pad.setPointerCapture(e.pointerId);}catch(_){}
  padMove(e);
});
pad.addEventListener("pointermove",e=>{if(e.pointerId===activePadPointer)padMove(e);});
function resetPad(e){
  if(e&&activePadPointer!==null&&e.pointerId!==activePadPointer)return;
  activePadPointer=null;joy={x:0,y:0};stick.style.transform="translate3d(0,0,0)";
}
pad.addEventListener("pointerup",resetPad);
pad.addEventListener("pointercancel",resetPad);
pad.addEventListener("lostpointercapture",resetPad);
const jumpButton=document.querySelector("#jump");
jumpButton.addEventListener("pointerdown",e=>{e.preventDefault();jump=true;});
jumpButton.addEventListener("pointerup",()=>jump=false);
jumpButton.addEventListener("pointercancel",()=>jump=false);
jumpButton.addEventListener("lostpointercapture",()=>jump=false);

let velocity=new THREE.Vector3(), grounded=false;
const clock=new THREE.Clock();
const temp=new THREE.Vector3();
const controllers=[];
for(let i=0;i<2;i++){
  const c=renderer.xr.getController(i); scene.add(c); controllers.push(c);
  const hand=new THREE.Mesh(new THREE.SphereGeometry(.12,12,10),handMat); c.add(hand);
}
const prevControllerPositions=[new THREE.Vector3(),new THREE.Vector3()];
const hasPrev=[false,false];

function animate(now){
  const dt=Math.min(clock.getDelta(),.04);
  const xr=renderer.xr.isPresenting;
  if(!xr){
    camera.rotation.order="YXZ";camera.rotation.set(pitch,yaw,0);
    const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const move=new THREE.Vector3();
    // Touch joystick axes are camera-relative; up on screen means forward.
    move.addScaledVector(right,joy.x);
    move.addScaledVector(forward,-joy.y);
    if(move.lengthSq()>0)move.normalize().multiplyScalar(5.2);
    velocity.x=move.x;velocity.z=move.z;
    if(jump&&camera.position.y<=1.57)velocity.y=4.4;
    velocity.y-=9.8*dt;
    camera.position.addScaledVector(velocity,dt);
    if(camera.position.y<1.55){camera.position.y=1.55;velocity.y=0;}
    firstPersonArms.visible=true;
  }else{
    // Basic controller-swing locomotion prototype: controller pulls add movement.
    for(let i=0;i<controllers.length;i++){
      const c=controllers[i], p=new THREE.Vector3();
      c.getWorldPosition(p);
      if(hasPrev[i]){
        const delta=p.clone().sub(prevControllerPositions[i]);
        if(delta.length()>.012){
          velocity.addScaledVector(delta,-2.3);
        }
      }
      prevControllerPositions[i].copy(p);hasPrev[i]=true;
    }
    velocity.y-=9.8*dt;
    camera.position.addScaledVector(velocity,dt);
    if(camera.position.y<1.55){camera.position.y=1.55;velocity.y=0;}
    // En VR, el torso sigue la cabeza y las manos reales siguen los mandos.
    firstPersonArms.visible=true;
  }
  // Colisión circular y superficies superiores: permite subir y quedarse encima.
  const feetY=camera.position.y-1.55;
  const previousFeetY=feetY-velocity.y*dt;
  let landed=false;
  for(const obj of solidObjects){
    const dx=camera.position.x-obj.x,dz=camera.position.z-obj.z;
    const dist=Math.hypot(dx,dz), minDist=obj.r+.28;
    if(dist<minDist){
      if(previousFeetY>=obj.top-.18 && feetY<=obj.top+.22 && velocity.y<=0){
        camera.position.y=obj.top+1.55;velocity.y=0;landed=true;
      }else if(feetY<obj.top-.12){
        const push=minDist-dist||.01;
        const nx=dist>0?dx/dist:1,nz=dist>0?dz/dist:0;
        camera.position.x+=nx*push;camera.position.z+=nz*push;
      }
    }
  }
  if(camera.position.y<1.55){camera.position.y=1.55;velocity.y=0;landed=true;}
  grounded=landed;
  sendPosition(now);
  renderMirror();
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
