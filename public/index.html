<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gorilla Forest VR</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17251b;font-family:system-ui,Arial;color:white}
  #hud{position:fixed;z-index:5;top:12px;left:12px;background:#102018cc;padding:10px 13px;border:1px solid #ffffff35;border-radius:12px;max-width:calc(100% - 48px)}
  #hud strong{font-size:17px} #status{font-size:12px;opacity:.85;margin-top:3px}
  #help{font-size:12px;opacity:.85;margin-top:5px}
  #name{width:112px;background:#ffffff18;color:white;border:1px solid #ffffff55;border-radius:7px;padding:6px}
  #mobile{display:none;position:fixed;z-index:6;bottom:24px;left:20px;width:130px;height:130px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff66;touch-action:none}
  #stick{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#ffffff99}
  #jump{display:none;position:fixed;z-index:6;right:24px;bottom:40px;width:92px;height:92px;border-radius:50%;border:2px solid white;background:#245f38cc;color:white;font-weight:bold}
  #error{position:fixed;z-index:10;bottom:10px;left:10px;right:10px;color:#ffd1d1;font-size:12px}
  @media (pointer:coarse){#mobile{display:block}#jump{display:block}#help{max-width:250px}}
</style>
</head>
<body>
<div id="hud">
  <strong>🦍 Gorilla Forest VR</strong><br>
  <span id="status">Conectando al servidor…</span><br>
  <input id="name" maxlength="18" value="Gorilla" aria-label="Nombre de jugador">
  <div id="help">PC: WASD + ratón · Tablet: joystick + botón SALTAR · Quest: pulsa ENTER VR</div>
</div>
<div id="mobile"><div id="stick"></div></div>
<button id="jump">SALTAR</button>
<div id="error"></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { VRButton } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js";

const statusEl = document.querySelector("#status");
const errorEl = document.querySelector("#error");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc9d5);
scene.fog = new THREE.Fog(0x9bc9d5, 28, 115);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 180);
camera.position.set(0, 1.55, 5);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

scene.add(new THREE.HemisphereLight(0xdff5ff, 0x52633a, 2.0));
const sun = new THREE.DirectionalLight(0xfff2d6, 2.2);
sun.position.set(-12, 24, 10); sun.castShadow = true; scene.add(sun);

const mat = (color, roughness=1) => new THREE.MeshStandardMaterial({color, roughness});
const groundMat = mat(0x527b3c);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(180,180), groundMat);
ground.rotation.x=-Math.PI/2; ground.position.y=-0.08; ground.receiveShadow=true; scene.add(ground);

const trunkMat=mat(0x68452b), leafMats=[mat(0x2f773e),mat(0x438b45),mat(0x28663b)];
const rockMat=mat(0x777e78);
function tree(x,z,s=1){
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.34*s,3.2*s,7),trunkMat);
  trunk.position.set(x,1.52*s,z); trunk.castShadow=true; trunk.receiveShadow=true; scene.add(trunk);
  for(let i=0;i<3;i++){
    const crown=new THREE.Mesh(new THREE.IcosahedronGeometry((1.15-i*.12)*s,1),leafMats[i]);
    crown.position.set(x+(i-1)*.18*s,3.2*s+i*.52*s,z); crown.castShadow=true; scene.add(crown);
  }
}
for(let i=0;i<90;i++){
  const a=Math.random()*Math.PI*2, r=9+Math.random()*48;
  tree(Math.cos(a)*r,Math.sin(a)*r,.7+Math.random()*.8);
}
for(let i=0;i<18;i++){
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.45+Math.random()*.65,0),rockMat);
  rock.position.set((Math.random()-.5)*55,.25,(Math.random()-.5)*55);
  rock.rotation.set(Math.random(),Math.random(),Math.random()); rock.castShadow=true; scene.add(rock);
}
// Stumps and low platforms
for(let i=0;i<9;i++){
  const x=(i%3-1)*4, z=-5-Math.floor(i/3)*4;
  const stump=new THREE.Mesh(new THREE.CylinderGeometry(.85,.95,1.1,9),trunkMat);
  stump.position.set(x,.48,z); stump.castShadow=true; scene.add(stump);
  const top=new THREE.Mesh(new THREE.CylinderGeometry(.86,.86,.12,9),mat(0x9b7448));
  top.position.set(x,1.06,z); scene.add(top);
}

const localMat=mat(0x76513b), handMat=mat(0x8c6247);
function makeGorilla(color=0x8c6247){
  const group=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(.38,12,10),mat(color));
  body.position.y=.95; group.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),mat(color));
  head.position.set(0,1.48,-.03); group.add(head);
  const eyeMat=mat(0x111111);
  for(const x of [-.105,.105]){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),eyeMat);
    eye.position.set(x,1.52,-.27); group.add(eye);
  }
  for(const side of [-1,1]){
    const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.52,4,8),mat(color));
    arm.position.set(side*.48,.93,-.02); arm.rotation.z=side*-.6; group.add(arm);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.19,10,8),handMat);
    hand.position.set(side*.72,.58,-.13); group.add(hand);
  }
  return group;
}
const localAvatar=makeGorilla(); scene.add(localAvatar); localAvatar.visible=false;
const remotes=new Map();
const socketUrl=(location.protocol==="https:"?"wss://":"ws://")+location.host;
let ws;
try{
  ws=new WebSocket(socketUrl);
  ws.onopen=()=>statusEl.textContent="Conectado · sala compartida";
  ws.onclose=()=>statusEl.textContent="Sin conexión · modo local";
  ws.onerror=()=>statusEl.textContent="No se pudo conectar al servidor";
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==="welcome"){myId=m.id; m.players.forEach(addRemote);}
    if(m.type==="joined") addRemote(m.player);
    if(m.type==="moved") updateRemote(m.player);
    if(m.type==="left"){const a=remotes.get(m.id);if(a)scene.remove(a);remotes.delete(m.id);}
  };
}catch(e){statusEl.textContent="Modo local";}

let myId=null;
function addRemote(p){
  if(p.id===myId)return;
  if(!remotes.has(p.id)){const a=makeGorilla(p.color);scene.add(a);remotes.set(p.id,a);}
  updateRemote(p);
}
function updateRemote(p){
  const a=remotes.get(p.id);if(!a)return;
  a.position.set(p.x,p.y-1.4,p.z);a.rotation.y=p.yaw||0;
}
let lastSend=0;
function sendPosition(now){
  if(ws?.readyState===1 && now-lastSend>70){
    lastSend=now;
    ws.send(JSON.stringify({type:"move",x:camera.position.x,y:camera.position.y,z:camera.position.z,yaw:camera.rotation.y,name:document.querySelector("#name").value}));
  }
}

const keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);
let yaw=0,pitch=0,locked=false;
renderer.domElement.addEventListener("click",()=>{if(!renderer.xr.isPresenting)renderer.domElement.requestPointerLock?.();});
document.addEventListener("pointerlockchange",()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener("mousemove",e=>{if(locked){yaw-=e.movementX*.002;pitch=Math.max(-1.1,Math.min(1.1,pitch-e.movementY*.002));}});
let joy={x:0,y:0},jump=false;
const pad=document.querySelector("#mobile"),stick=document.querySelector("#stick");
let padRect;
function padMove(e){
  const r=pad.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy, len=Math.hypot(dx,dy), max=42;
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  joy.x=dx/max;joy.y=dy/max;
  stick.style.transform=`translate(${dx}px,${dy}px)`;
}
pad.addEventListener("pointerdown",e=>{pad.setPointerCapture(e.pointerId);padMove(e);});
pad.addEventListener("pointermove",e=>{if(e.buttons)padMove(e);});
function resetPad(){joy={x:0,y:0};stick.style.transform="";}
pad.addEventListener("pointerup",resetPad);pad.addEventListener("pointercancel",resetPad);
document.querySelector("#jump").addEventListener("pointerdown",()=>jump=true);
document.querySelector("#jump").addEventListener("pointerup",()=>jump=false);

let velocity=new THREE.Vector3(), grounded=false;
const clock=new THREE.Clock();
const temp=new THREE.Vector3();
const controllers=[];
for(let i=0;i<2;i++){
  const c=renderer.xr.getController(i); scene.add(c); controllers.push(c);
  const hand=new THREE.Mesh(new THREE.SphereGeometry(.12,12,10),handMat); c.add(hand);
}
const prevControllerPositions=[new THREE.Vector3(),new THREE.Vector3()];
const hasPrev=[false,false];

function animate(now){
  const dt=Math.min(clock.getDelta(),.04);
  const xr=renderer.xr.isPresenting;
  if(!xr){
    camera.rotation.order="YXZ";camera.rotation.set(pitch,yaw,0);
    const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const move=new THREE.Vector3();
    if(keys.KeyW)move.add(forward);if(keys.KeyS)move.sub(forward);
    if(keys.KeyD)move.add(right);if(keys.KeyA)move.sub(right);
    move.x+=joy.x;move.z+=joy.y;
    if(move.lengthSq()>0)move.normalize().multiplyScalar(5.2*dt);
    velocity.x=move.x;velocity.z=move.z;
    if((keys.Space||jump)&&camera.position.y<=1.57)velocity.y=4.4;
    velocity.y-=9.8*dt;
    camera.position.addScaledVector(velocity,dt);
    if(camera.position.y<1.55){camera.position.y=1.55;velocity.y=0;}
    localAvatar.position.set(camera.position.x,camera.position.y-1.55,camera.position.z);
    localAvatar.rotation.y=yaw;
  }else{
    // Basic controller-swing locomotion prototype: controller pulls add movement.
    for(let i=0;i<controllers.length;i++){
      const c=controllers[i], p=new THREE.Vector3();
      c.getWorldPosition(p);
      if(hasPrev[i]){
        const delta=p.clone().sub(prevControllerPositions[i]);
        if(delta.length()>.012){
          velocity.addScaledVector(delta,-2.3);
        }
      }
      prevControllerPositions[i].copy(p);hasPrev[i]=true;
    }
    velocity.y-=9.8*dt;
    camera.position.addScaledVector(velocity,dt);
    if(camera.position.y<1.55){camera.position.y=1.55;velocity.y=0;}
    // Keep the avatar centered beneath the headset in VR.
    localAvatar.position.set(camera.position.x,camera.position.y-1.55,camera.position.z);
  }
  sendPosition(now);
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
